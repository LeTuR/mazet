# The gate every pull request passes. `prek run --all-files` runs the same
# checks locally; what is here is the copy nobody can skip.
name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel a superseded run when a new commit is pushed to the same PR, so rapid
# re-pushes don't pile up parallel Rust builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The suite runs on all three platforms because that is what the crate claims:
  # the store layout comes from `directories`, and the 0700 permission and the
  # path separators differ per platform. A Linux-only run would assert the
  # Windows and macOS paths only by hope.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true
      # Not `cog check`: it cannot exempt the no-mistakes gate's own fix
      # commits, whose subject that binary hardcodes. The script holds every
      # other commit to the same cog.toml.
      - name: Check conventional commits
        run: scripts/ci/check-conventional-commits.sh

  # The two installers, each with the suite the operator's other repositories
  # use for its language. Both run on ubuntu: every helper under test is a pure
  # mapping or parse that reads only what the test passes it, so neither needs
  # the platform it installs onto.
  install-sh:
    name: Installer (sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      # Every tracked shell script, not just the installer: nothing else in
      # this workflow would catch a break in scripts/ci/*.sh.
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Run the installer tests
        run: bats tests/install.bats

  install-ps1:
    name: Installer (PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pwsh is preinstalled on GitHub-hosted runners; Pester is not always,
      # and the version that is can predate 5.
      - name: Run the installer tests
        shell: pwsh
        run: |
          $have = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $have -or $have.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/install.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  # A single required status, so the branch protection rule names one check
  # rather than being edited every time a job is added. `if: always()` plus the
  # `needs.*.result` scan is what makes a skipped job count as success and a
  # cancelled one as failure.
  all-checks:
    name: All Checks
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - docs
      - conventional-commits
      - install-sh
      - install-ps1
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
