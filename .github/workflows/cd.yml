# Release: cross-compiled binaries for every supported target, attached to a
# GitHub Release, for one tag.
#
# A tag is what starts this, not a push to `main`, and this workflow neither
# decides the version nor creates the tag — `release.yml` does both on every
# push to `main` and then reaches this one through the `workflow_dispatch`
# input below. It has to: GitHub raises no workflow run from a tag pushed with
# the default `GITHUB_TOKEN`, so the `push: tags` trigger would never fire for
# an automated cut. That trigger stays for a tag pushed by a human.
#
# See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  # The entry point `release.yml` uses, and the one to re-run by hand for a tag
  # that already exists when a release job failed on something that was not the
  # code.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)."
        required: true
        type: string

# Never two releases at once, and never cancel one half-uploaded.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `GITHUB_REF_NAME` is the BRANCH on a workflow_dispatch, not the tag, so it
  # cannot name the release on its own. Resolved once, here, and used by name
  # everywhere below.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          # `cross` rather than a native build: the runner is x86_64, and its
          # container image carries the aarch64 glibc toolchain so the binary
          # links against a distro glibc instead of the runner's.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          # The musl pair is what install.sh hands a Linux machine, and the
          # reason both exist. A gnu binary carries a floor -- the glibc it was
          # linked against and never anything older -- so `ubuntu-latest`
          # moving to 24.04 silently put the x86_64 gnu asset out of reach of
          # Debian 12. These are statically linked and have no floor, so the
          # runner's distro stops deciding who can run the release.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          # macos-latest is arm64; the Apple toolchain cross-compiles the
          # x86_64 slice from it with nothing but the target installed.
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      # Unix archive: .tar.gz with the binary + LICENSE + README.
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target="${{ matrix.target }}"
          rel="target/$target/release"
          cp LICENSE README.md "$rel/"
          tar -czf "mazet-${VERSION}-${target}.tar.gz" -C "$rel" mazet LICENSE README.md

      # Windows archive: .zip, extractable with the built-in Expand-Archive so
      # an installer needs no tar.
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $rel = "target/$target/release"
          Compress-Archive -Force -DestinationPath "mazet-${env:VERSION}-${target}.zip" -Path `
            "$rel/mazet.exe", "LICENSE", "README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            mazet-*.tar.gz
            mazet-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect assets and checksum them
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec mv {} release-assets/ \;
          cd release-assets
          # One checksum file over every archive, so an installer can verify
          # what it downloaded without a second request per target.
          sha256sum ./*.tar.gz ./*.zip > "mazet-${VERSION}-checksums.txt"
          cat "mazet-${VERSION}-checksums.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          name: mazet ${{ env.VERSION }}
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
